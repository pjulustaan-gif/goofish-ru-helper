
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Find project archive
        run: |
          find . -name 'GoofishTranslator-cloud-build.zip'

      - name: Unzip project
        run: |
          unzip -o GoofishTranslator-cloud-build.zip -d project
          find project -name settings.gradle -print

      - name: Locate Android project
        run: |
          PROJECT_DIR="$(dirname "$(find project -name settings.gradle -print -quit)")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          test -n "$PROJECT_DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GoofishTranslator-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
